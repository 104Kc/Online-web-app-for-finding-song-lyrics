<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เสียงในความทรงจำ | ค้นหาเพลง</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap');

    :root { --ink: #263238; --muted: #6b7777; --cream: #f6f0e6; --paper: #fffdf8; --coral: #e76f51; --teal: #176b68; --line: #e8dccd; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--cream); font-family: Sarabun, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .32; background: radial-gradient(circle at 12% 8%, #f2c38b 0 2px, transparent 3px), radial-gradient(circle at 88% 20%, #e76f51 0 2px, transparent 3px); background-size: 38px 38px, 52px 52px; }
    .shell { position: relative; max-width: 1050px; margin: 0 auto; padding: 44px 24px 72px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 34px; }
    .eyebrow { color: var(--coral); font: 700 13px 'Chakra Petch', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    h1 { max-width: 650px; margin: 8px 0 0; font: 700 clamp(34px, 6vw, 64px)/1.04 'Chakra Petch', sans-serif; letter-spacing: 0; }
    .intro { max-width: 280px; margin: 0 0 5px; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .search-panel { padding: 24px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 12px 12px 0 #e7d5c0; }
    .search-row { display: flex; gap: 12px; }
    input { min-width: 0; flex: 1; padding: 16px 18px; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 6px; outline: none; font: 16px Sarabun, sans-serif; }
    input:focus { border-color: var(--teal); }
    button { border: 0; border-radius: 6px; cursor: pointer; font: 600 16px Sarabun, sans-serif; transition: transform .18s, background .18s; }
    button:hover { transform: translateY(-2px); }
    .primary { padding: 0 26px; color: #fff; background: var(--teal); }
    .tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
    .mic { display: inline-flex; align-items: center; gap: 9px; padding: 10px 14px; color: var(--teal); background: #e4f0eb; }
    .mic.listening { color: #fff; background: var(--coral); animation: pulse 1.2s infinite; }
    .hint, #status { color: var(--muted); font-size: 14px; }
    #status { min-height: 22px; }
    .transcript { display: none; margin-top: 15px; padding: 12px 14px; color: var(--ink); background: #fbf6ee; border-left: 3px solid var(--coral); font-size: 15px; }
    .transcript.visible { display: block; }
    .transcript-label { display: block; margin-bottom: 3px; color: var(--coral); font-size: 12px; font-weight: 700; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 48px 0 14px; }
    h2 { margin: 0; font: 600 25px 'Chakra Petch', sans-serif; }
    .count { color: var(--coral); font: 600 14px 'Chakra Petch', sans-serif; }
    .saved-link { padding: 8px 12px; color: var(--teal); background: #e4f0eb; }
    #results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .result { display: flex; align-items: center; gap: 16px; padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; animation: rise .35s both; }
    .rank { display: grid; place-items: center; flex: 0 0 38px; height: 38px; color: var(--coral); background: #f8e1d6; border-radius: 50%; font: 700 17px 'Chakra Petch', sans-serif; }
    .song { min-width: 0; flex: 1; }
    .song-link { display: block; padding: 0; color: var(--ink); background: none; text-align: left; }
    .song strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; }
    .artist { color: var(--muted); }
    .score { margin-top: 4px; color: var(--teal); font-size: 13px; }
    .favorite { flex: 0 0 auto; padding: 8px; color: var(--coral); background: transparent; font-size: 22px; }
    .favorite.saved { color: #d84b3b; }
    .lyrics-view { display: none; margin-top: 30px; padding: 28px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 10px 10px 0 #e7d5c0; }
    .lyrics-view.active { display: block; animation: rise .35s both; }
    .detail-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .detail-top h2 { font-size: 32px; }
    .detail-artist { margin: 4px 0 22px; color: var(--muted); font-size: 17px; }
    .close-detail { padding: 8px 12px; color: var(--teal); background: #e4f0eb; }
    .lyrics-text { max-height: 430px; overflow: auto; margin: 0; padding: 20px; color: #3d4646; background: #fbf6ee; border-left: 3px solid var(--coral); white-space: pre-wrap; font: 17px/1.9 Sarabun, sans-serif; }
    #empty { padding: 30px; color: var(--muted); text-align: center; background: rgba(255,253,248,.7); border: 1px dashed var(--line); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(231,111,81,.16); } }
    @media (max-width: 700px) { .shell { padding: 28px 16px 56px; } header { display: block; } .intro { margin-top: 18px; } .search-row { flex-direction: column; } .primary { padding: 13px; } #results { grid-template-columns: 1fr; } .tools { align-items: flex-start; flex-direction: column; } .detail-top h2 { font-size: 25px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">Memory Lane / Thai Lyrics</div><h1>จำทำนองได้<br>หาเพลงให้เจอ</h1></div>
      <p class="intro">ค้นหาด้วยชื่อเพลง เนื้อเพลงที่จำได้ หรือกดไมค์แล้วร้อง ระบบจะหาเพลงที่ตรงที่สุดให้</p>
    </header>
    <section class="search-panel" aria-label="ค้นหาเพลง">
      <div class="search-row"><input id="query" placeholder="พิมพ์ชื่อเพลงหรือเนื้อเพลง เช่น ขวานบิ่น" autocomplete="off"><button class="primary" id="searchButton">ค้นหาเพลง</button></div>
      <div class="tools"><button class="mic" id="micButton" type="button"><span aria-hidden="true">●</span> ร้องเพลงเพื่อค้นหา</button><span class="hint">รองรับการถอดเสียงภาษาไทยจากไมโครโฟน</span><span id="status" role="status"></span></div>
      <div class="transcript" id="transcript"><span class="transcript-label">ระบบได้ยินว่า</span><span id="transcriptText"></span></div>
    </section>
    <div class="section-head"><h2>เพลงที่ใกล้เคียง</h2><div><button class="saved-link" id="savedLink" type="button">หัวใจของฉัน <span id="savedCount">0</span></button><span class="count" id="count"></span></div></div>
    <div id="results"></div>
    <div id="empty" hidden>ยังไม่พบเพลงที่ใกล้เคียง ลองใช้ท่อนอื่นดูนะ</div>
    <section class="lyrics-view" id="lyricsView" aria-live="polite">
      <div class="detail-top"><div><h2 id="detailTitle"></h2><div class="detail-artist" id="detailArtist"></div></div><button class="close-detail" id="closeDetail" type="button">ปิด</button></div>
      <pre class="lyrics-text" id="lyricsText"></pre>
    </section>
  </main>
  <script>
    const queryInput = document.getElementById('query');
    const resultsDiv = document.getElementById('results');
    const emptyDiv = document.getElementById('empty');
    const status = document.getElementById('status');
    const count = document.getElementById('count');
    const micButton = document.getElementById('micButton');
    const transcript = document.getElementById('transcript');
    const transcriptText = document.getElementById('transcriptText');
    const lyricsView = document.getElementById('lyricsView');
    const savedCount = document.getElementById('savedCount');
    const savedLink = document.getElementById('savedLink');
    let savedSongs = JSON.parse(localStorage.getItem('savedSongs') || '[]');
    let displayedSongs = [];
    let showingSaved = false;
    let recognition;

    function updateSavedCount() { savedCount.textContent = savedSongs.length; }
    function isSaved(songId) { return savedSongs.some(song => String(song.song_id) === String(songId)); }
    function toggleSaved(song) {
      if (isSaved(song.song_id)) savedSongs = savedSongs.filter(item => String(item.song_id) !== String(song.song_id));
      else savedSongs.push({ song_id: song.song_id, title: song.title, artist: song.artist });
      localStorage.setItem('savedSongs', JSON.stringify(savedSongs)); updateSavedCount();
      renderResults(showingSaved ? savedSongs : displayedSongs, showingSaved);
    }
    function openSong(songId) { window.location.href = `/song/${songId}`; }
    function renderResults(songs, savedOnly = false) {
      resultsDiv.innerHTML = ''; emptyDiv.hidden = songs.length > 0; count.textContent = songs.length ? `${songs.length} รายการ` : '';
      songs.forEach((song, index) => {
        const card = document.createElement('article'); card.className = 'result'; card.style.animationDelay = `${index * 55}ms`;
        const score = song.score === undefined ? '' : `<div class="score">ความใกล้เคียง ${Math.round(song.score * 100)}%</div>`;
        card.innerHTML = `<div class="rank">${index + 1}</div><div class="song"><button class="song-link" type="button"><strong>${escapeHtml(song.title)}</strong><span class="artist">${escapeHtml(song.artist)}</span>${score}</button></div><button class="favorite ${isSaved(song.song_id) ? 'saved' : ''}" type="button" aria-label="บันทึกเพลง">${isSaved(song.song_id) ? '♥' : '♡'}</button>`;
        card.querySelector('.song-link').addEventListener('click', () => openSong(song.song_id));
        card.querySelector('.favorite').addEventListener('click', () => toggleSaved(song));
        resultsDiv.appendChild(card);
      });
      if (savedOnly) status.textContent = songs.length ? 'เพลงที่บันทึกไว้' : 'ยังไม่มีเพลงที่บันทึกไว้';
    }

    async function doSearch() {
      const q = queryInput.value.trim();
      resultsDiv.innerHTML = ''; emptyDiv.hidden = true; count.textContent = '';
      if (!q) { status.textContent = 'พิมพ์ชื่อเพลง เนื้อเพลง หรือกดไมค์เพื่อเริ่มค้นหา'; return; }
      status.textContent = 'กำลังค้นหา...';
      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await response.json();
        count.textContent = data.results.length ? `${data.results.length} รายการ` : '';
        status.textContent = data.results.length
          ? `พบเพลงที่ใกล้เคียง ${data.results.length} รายการ`
          : 'ไม่พบเพลงที่ตรง ลองร้องหรือพูดท่อนอื่นอีกครั้ง';
        displayedSongs = data.results; showingSaved = false; renderResults(displayedSongs);
      } catch (error) { status.textContent = 'เชื่อมต่อระบบค้นหาไม่ได้ ลองใหม่อีกครั้ง'; }
    }

    function escapeHtml(value) { const div = document.createElement('div'); div.textContent = value; return div.innerHTML; }
    document.getElementById('searchButton').addEventListener('click', doSearch);
    document.getElementById('closeDetail').addEventListener('click', () => lyricsView.classList.remove('active'));
    savedLink.addEventListener('click', () => { showingSaved = true; renderResults(savedSongs, true); });
    updateSavedCount();
    queryInput.addEventListener('keydown', event => { if (event.key === 'Enter') doSearch(); });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition(); recognition.lang = 'th-TH'; recognition.interimResults = false; recognition.continuous = false;
      recognition.onstart = () => { micButton.classList.add('listening'); micButton.innerHTML = '<span aria-hidden="true">●</span> กำลังฟัง...'; status.textContent = 'ร้องเพลงหรือพูดชื่อเพลงที่ต้องการค้นหา'; };
      recognition.onresult = event => {
        const spokenText = event.results[0][0].transcript.trim();
        queryInput.value = spokenText;
        transcriptText.textContent = spokenText || 'ระบบไม่ได้ยินคำร้อง';
        transcript.classList.add('visible');
        status.textContent = 'รับข้อความแล้ว กำลังค้นหาเพลง...';
        doSearch();
      };
      recognition.onerror = event => { status.textContent = event.error === 'not-allowed' ? 'กรุณาอนุญาตให้เว็บไซต์ใช้ไมโครโฟน' : 'ฟังเสียงไม่สำเร็จ ลองใหม่อีกครั้ง'; };
      recognition.onnomatch = () => { status.textContent = 'ฟังเสียงได้ แต่แปลงเป็นคำร้องไม่ได้ ลองร้องให้ชัดขึ้น'; };
      recognition.onend = () => { micButton.classList.remove('listening'); micButton.innerHTML = '<span aria-hidden="true">●</span> ร้องเพลงเพื่อค้นหา'; };
      micButton.addEventListener('click', () => {
        transcript.classList.remove('visible');
        status.textContent = 'กำลังเปิดไมโครโฟน...';
        try { recognition.start(); } catch (error) { status.textContent = 'ไมโครโฟนกำลังทำงานอยู่ กรุณารอสักครู่'; }
      });
    } else { micButton.disabled = true; micButton.textContent = 'เบราว์เซอร์นี้ไม่รองรับเสียง'; }
  </script>
</body>
</html>
